name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Permite ejecutarlo manualmente desde la pestaña "Actions" cuando aparezcan
  # errores transitorios del servicio de GitHub (p. ej. "Service Unavailable").
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    # Entorno de ejecución fijo. 'ubuntu-latest' puede apuntar a una imagen de
    # lanzamiento reciente con fallos; si el machine type se satura, se puede
    # cambiar a ubuntu-24.04 ó ubuntu-22.04.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies (with retry)
        run: |
          set -e
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES"
            if npm ci; then
              echo "npm ci succeeded"
              break
            elif [ $i -eq $MAX_RETRIES ]; then
              echo "npm ci failed after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "npm ci failed, retrying in 30s..."
            sleep 30
          done

      - name: Install Playwright Browsers (with retry)
        run: |
          set -e
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i of $MAX_RETRIES"
            if npx playwright install --with-deps; then
              echo "Playwright install succeeded"
              break
            elif [ $i -eq $MAX_RETRIES ]; then
              echo "Playwright install failed after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "Playwright install failed, retrying in 30s..."
            sleep 30
          done

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
